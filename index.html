<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أبيكس | APEX - السوق العالمي المفتوح</title>
    
    <!-- كود التحقق الجديد الخاص بـ Google Search Console -->
    <meta name="google-site-verification" content="DjVRYGSfKdvIYzBQ50gX9TvBFMJNyg6q0paMC_V0rQw" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #fff; min-height: 100vh; padding-bottom: 20px; }

        /* ---------------- الهيدر الرئيسي ---------------- */
        header { background-color: #1e293b; padding: 12px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff9900; position: sticky; top: 0; z-index: 100; gap: 10px; }
        .logo { font-size: 26px; font-weight: 900; color: #ff9900; cursor: pointer; letter-spacing: 1px; }
        
        .search-bar { display: flex; flex: 1; min-width: 200px; order: 3; }
        @media(min-width: 768px){ .search-bar { order: 2; max-width: 500px; margin: 0 20px; } }
        .search-bar input { width: 100%; padding: 10px 12px; border-radius: 0 8px 8px 0; border: 1px solid #334155; border-left: none; outline: none; background: #0f172a; color: #fff; font-size: 14px; }
        .search-bar button { background: #ff9900; border: none; padding: 10px 15px; border-radius: 8px 0 0 8px; cursor: pointer; color: #fff; font-weight: bold; font-size: 14px; }
        
        .nav-btns { order: 2; display: flex; gap: 8px; }
        @media(min-width: 768px){ .nav-btns { order: 3; } }
        .nav-btns button { background: linear-gradient(135deg, #ff9900, #e68a00); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; white-space: nowrap; }

        .container { max-width: 1200px; margin: 15px auto; padding: 0 15px; }

        /* ---------------- الواجهة الرئيسية (معرض المنتجات) ---------------- */
        .hero-banner { background: linear-gradient(135deg, #1e293b, #334155); padding: 20px 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #334155; }
        .hero-banner h1 { font-size: 22px; color: #ff9900; margin-bottom: 8px; }
        @media(min-width: 768px){ .hero-banner h1 { font-size: 30px; } }
        .hero-banner p { color: #94a3b8; font-size: 13px; }

        .section-title { font-size: 18px; color: #f8fafc; margin-bottom: 15px; border-right: 4px solid #ff9900; padding-right: 10px; }

        /* شبكة العرض للابتوب والجوال */
        .market-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media(min-width: 600px){ .market-grid { grid-template-columns: repeat(3, 1fr); gap: 15px; } }
        @media(min-width: 900px){ .market-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:active { transform: scale(0.98); }
        .product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        @media(min-width: 768px){ .product-card img { height: 180px; } }
        .product-card h3 { font-size: 14px; margin-bottom: 6px; color: #f1f5f9; line-height: 1.3; }
        .product-card .price { color: #22c55e; font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .product-card .merchant-tag { font-size: 11px; color: #94a3b8; }

        /* ---------------- نافذة تفاصيل المنتج (Modal) ---------------- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; width: 100%; border: 1px solid #ff9900; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 10px; left: 15px; font-size: 28px; color: #ff9900; cursor: pointer; }
        .modal-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px){ .modal-grid { grid-template-columns: 1fr 1fr; } }
        .modal img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .wa-btn { display: block; width: 100%; background: #25D366; color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 15px; font-size: 15px; }

        /* ---------------- التسجيل ولوحة التحكم ---------------- */
        #registerPage, #dashboardPage { display: none; }
        .form-card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; margin: 10px auto; border: 1px solid #334155; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; }
        .submit-btn { width: 100%; background: #ff9900; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <div class="logo" onclick="showPage('homePage')">APEX</div>
        <div class="nav-btns">
            <button onclick="showPage('registerPage')">تسجيل تاجر</button>
            <button id="dashBtn" style="display:none;" onclick="showPage('dashboardPage')">لوحة متجري</button>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="ابحث في المنتجات...">
            <button>بحث</button>
        </div>
    </header>

    <div class="container">
        <!-- 1. الواجهة الرئيسية -->
        <div id="homePage">
            <div class="hero-banner">
                <h1>سوق أبيكس العالمي (APEX)</h1>
                <p>تصفح منتجات التجار وتواصل معهم مباشرة عبر الواتساب</p>
            </div>

            <h2 class="section-title">جميع المنتجات</h2>
            <div class="market-grid" id="globalMarketGrid"></div>
        </div>

        <!-- 2. صفحة التسجيل -->
        <div id="registerPage">
            <div class="form-card">
                <h2 style="color:#ff9900; text-align:center; margin-bottom:15px; font-size:20px;">تسجيل تاجر جديد</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group"><label>اسم المتجر / التاجر</label><input type="text" id="regStore" required></div>
                    <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="regEmail" required></div>
                    <div class="form-group"><label>كلمة المرور</label><input type="password" required minlength="6"></div>
                    <div class="form-group">
                        <label>الدولة</label>
                        <select id="regCountry">
                            <option value="اليمن">اليمن</option>
                            <option value="السعودية">المملكة العربية السعودية</option>
                            <option value="الإمارات">الإمارات العربية المتحدة</option>
                            <option value="مصر">مصر</option>
                        </select>
                    </div>
                    <div class="form-group"><label>رقم الواتساب (مع الرمز الدولي)</label><input type="tel" id="regWa" placeholder="+967783300783" required></div>
                    <button type="submit" class="submit-btn">إنشاء المتجر</button>
                </form>
            </div>
        </div>

        <!-- 3. لوحة تحكم التاجر -->
        <div id="dashboardPage">
            <h2 class="section-title" id="merchantTitle">لوحة التحكم</h2>
            <div class="form-card" style="max-width:100%;">
                <h3 style="color:#ff9900; margin-bottom:12px; font-size:16px;">إضافة منتج جديد</h3>
                <form onsubmit="handleAddProduct(event)">
                    <div class="form-group"><label>اسم المنتج</label><input type="text" id="pName" required></div>
                    <div class="form-group"><label>السعر ($)</label><input type="number" id="pPrice" required></div>
                    <div class="form-group"><label>اختر صورة من المعرض</label><input type="file" id="pFile" accept="image/*" required></div>
                    <button type="submit" class="submit-btn">نشر المنتج</button>
                </form>
            </div>
        </div>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-grid">
                <div><img id="modalImg" src="" alt="صورة المنتج"></div>
                <div>
                    <h2 id="modalTitle" style="color:#fff; margin-bottom:8px; font-size:18px;"></h2>
                    <div id="modalPrice" style="color:#22c55e; font-size:20px; font-weight:bold; margin-bottom:10px;"></div>
                    <p id="modalMerchant" style="color:#94a3b8; font-size:13px; margin-bottom:5px;"></p>
                    <p id="modalCountry" style="color:#94a3b8; font-size:13px; margin-bottom:15px;"></p>
                    <a id="modalWaBtn" href="" target="_blank" class="wa-btn">💬 تواصل عبر الواتساب</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalProducts = [
            { id: 1, name: "عباية راقية كلاسيك", price: "60", img: "https://via.placeholder.com/300/1e293b/fff?text=عباية+راقية", merchant: "لمسه وابداع للعبايات الراقيه", country: "اليمن", wa: "967783300783" },
            { id: 2, name: "ساعة ذكية مقاومة للماء", price: "45", img: "https://via.placeholder.com/300/1e293b/fff?text=ساعة+ذكية", merchant: "متجر القمة العالمي", country: "السعودية", wa: "966500000000" }
        ];

        let currentMerchant = null;

        function renderGlobalMarket() {
            const grid = document.getElementById('globalMarketGrid');
            grid.innerHTML = '';
            globalProducts.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openProductModal(${p.id})">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <div class="price">$${p.price}</div>
                        <div class="merchant-tag">${p.merchant}</div>
                    </div>
                `;
            });
        }

        function openProductModal(id) {
            const p = globalProducts.find(item => item.id === id);
            if(p) {
                document.getElementById('modalImg').src = p.img;
                document.getElementById('modalTitle').innerText = p.name;
                document.getElementById('modalPrice').innerText = "$" + p.price;
                document.getElementById('modalMerchant').innerText = "📍 التاجر: " + p.merchant;
                document.getElementById('modalCountry').innerText = "🌍 الدولة: " + p.country;
                document.getElementById('modalWaBtn').href = `https://wa.me/${p.wa.replace('+','')}` + `?text=مرحباً،%20أنا%20مهتم%20بمنتج:%20${encodeURIComponent(p.name)}`;
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        function closeModal() { document.getElementById('productModal').style.display = 'none'; }

        function showPage(pageId) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('registerPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'block';
        }

        function handleRegister(e) {
            e.preventDefault();
            currentMerchant = {
                store: document.getElementById('regStore').value,
                email: document.getElementById('regEmail').value,
                country: document.getElementById('regCountry').value,
                wa: document.getElementById('regWa').value
            };
            document.getElementById('merchantTitle').innerText = "لوحة تحكم: " + currentMerchant.store;
            document.getElementById('dashBtn').style.display = 'inline-block';
            showPage('dashboardPage');
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const file = document.getElementById('pFile').files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const newProd = {
                        id: Date.now(),
                        name: document.getElementById('pName').value,
                        price: document.getElementById('pPrice').value,
                        img: evt.target.result,
                        merchant: currentMerchant.store,
                        country: currentMerchant.country,
                        wa: currentMerchant.wa
                    };
                    globalProducts.unshift(newProd);
                    renderGlobalMarket();
                    showPage('homePage');
                };
                reader.readAsDataURL(file);
            }
        }

        renderGlobalMarket();
    </script>
</body>
</html>
