<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أبيكس | APEX - السوق العالمي المفتوح</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #fff; min-height: 100vh; padding-bottom: 20px; }

        /* ---------------- الهيدر الرئيسي ---------------- */
        header { background-color: #1e293b; padding: 12px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff9900; position: sticky; top: 0; z-index: 100; gap: 10px; }
        .logo { font-size: 26px; font-weight: 900; color: #ff9900; cursor: pointer; letter-spacing: 1px; }
        
        .search-bar { display: flex; flex: 1; min-width: 200px; order: 3; }
        @media(min-width: 768px){ .search-bar { order: 2; max-width: 500px; margin: 0 20px; } }
        .search-bar input { width: 100%; padding: 10px 12px; border-radius: 0 8px 8px 0; border: 1px solid #334155; border-left: none; outline: none; background: #0f172a; color: #fff; font-size: 14px; }
        .search-bar button { background: #ff9900; border: none; padding: 10px 15px; border-radius: 8px 0 0 8px; cursor: pointer; color: #fff; font-weight: bold; font-size: 14px; }
        
        .nav-btns { order: 2; display: flex; gap: 8px; }
        @media(min-width: 768px){ .nav-btns { order: 3; } }
        .nav-btns button { background: linear-gradient(135deg, #ff9900, #e68a00); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; white-space: nowrap; }

        .container { max-width: 1200px; margin: 15px auto; padding: 0 15px; }

        /* ---------------- الواجهة الرئيسية (معرض المنتجات) ---------------- */
        .hero-banner { background: linear-gradient(135deg, #1e293b, #334155); padding: 20px 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #334155; }
        .hero-banner h1 { font-size: 22px; color: #ff9900; margin-bottom: 8px; }
        @media(min-width: 768px){ .hero-banner h1 { font-size: 30px; } }
        .hero-banner p { color: #94a3b8; font-size: 13px; }

        .section-title { font-size: 18px; color: #f8fafc; margin-bottom: 15px; border-right: 4px solid #ff9900; padding-right: 10px; }

        /* شبكة العرض للابتوب والجوال */
        .market-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media(min-width: 600px){ .market-grid { grid-template-columns: repeat(3, 1fr); gap: 15px; } }
        @media(min-width: 900px){ .market-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:active { transform: scale(0.98); }
        .product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        @media(min-width: 768px){ .product-card img { height: 180px; } }
        .product-card h3 { font-size: 14px; margin-bottom: 6px; color: #f1f5f9; line-height: 1.3; }
        .product-card .price { color: #22c55e; font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .product-card .merchant-tag { font-size: 11px; color: #94a3b8; }

        /* ---------------- نافذة تفاصيل المنتج (Modal) ---------------- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; width: 100%; border: 1px solid #ff9900; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 10px; left: 15px; font-size: 28px; color: #ff9900; cursor: pointer; }
        .modal-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px){ .modal-grid { grid-template-columns: 1fr 1fr; } }
        .modal img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .wa-btn { display: block; width: 100%; background: #25D366; color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 15px; font-size: 15px; }

        /* ---------------- التسجيل ولوحة التحكم ---------------- */
        #registerPage, #dashboardPage { display: none; }
